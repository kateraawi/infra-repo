apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-dir 
  namespace: flux-system # в примере default, но мне показалось, что лучше во
  # flux-system или можно отдельный неймспейс
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system # из какого репозитория берем (а он пока один)
  path: "./apps" # конкретно берем из директории apps в репозитории
  prune: true # удалим объекты из кластера, если их удалим из репозитория
  timeout: 1m
